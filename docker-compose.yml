version: '3.8'

services:
  aegis-ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_sar_ml_service
    restart: unless-stopped
    ports:
      - "7860:7860"
      - "8000:7860"
    environment:
      - PORT=7860
      - DEVICE=cpu
      - DETECTION_THRESHOLD=0.50
      - MIN_SPILL_PIXELS=50
      - AIS_SEARCH_RADIUS_KM=20.0
      - GFW_API_TOKEN=${GFW_API_TOKEN:-}
      - CORS_ORIGINS=*
    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
